# Every hour: mirror Terebyte's public log of share keys into keys/ and check its whole history
# (scripts/key-log.mjs). A failed check fails the run, and nothing is written.
name: Share key log
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: key-log
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/key-log.mjs https://terebyte.com
      - name: Commit what's new
        run: |
          git add keys
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Terebyte key log" -c user.email="transparency@terebyte.com" commit -q -m "Share key log: $(tail -1 keys/heads.jsonl)"
          git push
